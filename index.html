<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reality Labs Coaching</title>
  <link rel="icon" type="image/png" href="TRLLogomain.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#E39703',
            'gold-dim': 'rgba(227,151,3,0.15)',
            'gold-line': 'rgba(227,151,3,0.3)',
            's1': '#0A0A0A',
            's2': '#111111',
            's3': '#1A1A1A',
          },
          fontFamily: {
            sans: ['IBM Plex Sans', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    :root {
      --gold: #E39703;
      --gold-dim: rgba(227,151,3,0.15);
      --gold-line: rgba(227,151,3,0.3);
      --gold-glow: rgba(227,151,3,0.05);
      --s1: #0A0A0A;
      --s2: #111111;
      --s3: #1A1A1A;
      --text-muted: rgba(255,255,255,0.45);
      --text-dim: rgba(255,255,255,0.65);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #fff; font-family: 'IBM Plex Sans', sans-serif; }
    #app { min-height: 100vh; }

    /* Grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
      z-index: 9999;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: var(--gold-line); border-radius: 2px; }

    /* Gold line divider */
    .gold-line { height: 1px; background: var(--gold-line); }

    /* Cards */
    .card {
      background: var(--s1);
      border: 1px solid rgba(227,151,3,0.2);
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(227,151,3,0.05);
    }
    .card-elevated {
      background: var(--s2);
      border: 1px solid rgba(227,151,3,0.2);
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(227,151,3,0.05);
    }

    /* Buttons */
    .btn-gold {
      background: var(--gold);
      color: #000;
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.04em;
      padding: 12px 28px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: opacity 300ms ease, transform 300ms ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-gold:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-gold:active { transform: translateY(0); opacity: 1; }
    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      font-weight: 500;
      font-size: 0.875rem;
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer;
      transition: border-color 300ms ease, color 300ms ease;
    }
    .btn-ghost:hover { border-color: var(--gold-line); color: #fff; }

    /* Form inputs */
    .input {
      background: var(--s2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #fff;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.9375rem;
      padding: 12px 16px;
      width: 100%;
      outline: none;
      transition: border-color 300ms ease;
    }
    .input:focus { border-color: var(--gold-line); }
    .input::placeholder { color: var(--text-muted); }
    textarea.input { resize: vertical; min-height: 100px; }

    /* Sidebar nav */
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 300ms ease, color 300ms ease;
      text-decoration: none;
    }
    .nav-item:hover { background: var(--gold-dim); color: #fff; }
    .nav-item.active { background: var(--gold-dim); color: var(--gold); border-left: 2px solid var(--gold); }

    /* Badge */
    .badge {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .badge-gold { background: var(--gold-dim); color: var(--gold); }
    .badge-muted { background: rgba(255,255,255,0.07); color: var(--text-muted); }
    .badge-green { background: rgba(74,222,128,0.1); color: #4ade80; }

    /* Slider */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--s3);
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      transition: transform 200ms ease;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes typewriter { from { width: 0; } to { width: 100%; } }
    .fade-in { animation: fadeIn 400ms ease both; }
    .fade-in-delay-1 { animation: fadeIn 400ms ease 100ms both; }
    .fade-in-delay-2 { animation: fadeIn 400ms ease 200ms both; }
    .fade-in-delay-3 { animation: fadeIn 400ms ease 300ms both; }

    /* Interview chat */
    .chat-bubble-ai {
      background: var(--s2);
      border: 1px solid rgba(227,151,3,0.15);
      border-radius: 0 12px 12px 12px;
      padding: 16px 20px;
      max-width: 80%;
      color: var(--text-dim);
      font-size: 0.9375rem;
      line-height: 1.6;
    }
    .chat-bubble-user {
      background: var(--gold-dim);
      border: 1px solid var(--gold-line);
      border-radius: 12px 12px 0 12px;
      padding: 14px 18px;
      max-width: 75%;
      color: #fff;
      font-size: 0.9375rem;
      line-height: 1.5;
      align-self: flex-end;
    }

    /* Dot typing indicator */
    .typing-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: pulse 1.2s ease infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    /* Heatmap */
    .heatmap-dot { width: 10px; height: 10px; border-radius: 2px; background: var(--s3); }
    .heatmap-dot.active { background: var(--gold); }

    /* Progress bar */
    .progress-bar {
      height: 3px;
      background: var(--s3);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 2px;
      transition: width 500ms ease;
    }

    /* Label */
    .label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Radial glow */
    .glow-gold { box-shadow: 0 0 60px rgba(227,151,3,0.08); }

    /* Tab bar */
    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 300ms ease;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* Vision board grid */
    .vision-image {
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid rgba(227,151,3,0.15);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
  <script src="views/login.js"></script>
  <script src="views/interview.js"></script>
  <script src="views/dashboard.js"></script>
  <script src="views/checkin.js"></script>
  <script src="views/exercises.js"></script>
  <script src="views/meditations.js"></script>
  <script src="views/journal.js"></script>
  <script src="views/homework.js"></script>
  <script src="views/vision.js"></script>
  <script src="views/progress.js"></script>
  <script src="views/admin.js"></script>
  <script src="views/live-from-end.js"></script>
  <script src="views/feed.js"></script>
  <script src="views/noa.js"></script>
</body>
</html>
